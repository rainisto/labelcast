# labelcast config used by the demo (start.sh copies it to $RUN_DIR/conf/label.conf
# and adjusts the camera and port). Tuned for a Logitech C920: MJPEG 1280x720@30 → H.264.

[source]
type = "ffmpeg"
overlay = "xml"
args = ["-f", "v4l2", "-input_format", "mjpeg", "-video_size", "1280x720", "-framerate", "30",
        "-i", "/dev/video0", "-c:v", "libx264", "-preset", "veryfast", "-tune", "zerolatency",
        "-g", "30", "-b:v", "4M"]

[output]
url = "udp://127.0.0.1:50100?ttl=1"

[label]
encoding = "xml"
interval = 1.0
policy = "NATO"
classification = "UNCLASSIFIED"
originator = { id = "labelcast-demo@example.org", type = "rfc822Name" }

[[label.category]]
tag_name = "Releasable to"
type = "PERMISSIVE"
values = ["FIN"]
